[build-system]
requires = ["setuptools"]


[project]
name = "proper"
version = "0.3"
description = "A python web framework optimized for programmer happiness"
authors = [
    {name = "Juan Pablo Scaletti", email = "juanpablo@jpscaletti.com"},
]
license = "MIT"
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.12,<4"
dependencies = [
    "babel >= 2.17.0",
    "hecto >= 2.0.3",
    "huey ~= 2.5.2",
    "inflection >= 0.5.1",
    "isort ~= 5.0",
    "itsdangerous ~= 1.1",
    "jx >= 0.5.1",
    "markupsafe >= 2.0",
    "passlib ~= 1.7",
    "peewee ~= 3.15",
    "peewee-migrate >=1.12.1,< 2",
    "proper-cli ~= 1.2",
    "python-dateutil ~= 2.9.0",
    "traceback-with-variables ~= 2.0.4",
    "types-peewee ~= 3.17.7.20241017",
    "tzdata>=2025.3",
]

[project.urls]
homepage = "https://proper.scaletti.dev/"
repository = "https://github.com/jpsca/proper"
documentation = "https://proper.scaletti.dev/"


[dependency-groups]
dev = [
    "ipdb >= 0.13",
    "pre-commit",
    "ruff >= 0.2.0",
    "tox-uv",
    "ty>=0.0.1a24",
]
test = [
    "pytest >= 7.2",
    "pytest-cov",
    # To test installable frameworks
    "boto3 >= 1.35.71",
    "poyo",
    "pytest-smtpd",
    "pyvips >= 2.0.0",
    "smtpdfix",
]


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
proper = [
    "blueprints",
    "core/templates",
]
[tool.setuptools.exclude-package-data]
"*" = [
    "**/__pycache__",
    "*.pyc",
    "*.pyo",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "TYPE_CHECKING",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
omit = [
    "src/proper/blueprints/*",
    "src/proper/app_test.py",
    "src/proper/cli/*",
    "src/proper/storage/*", # TODO
]

[tool.coverage.html]
directory = "covreport"


[tool.ty.src]
exclude = [
    "**/__pycache__",
    "**/tests/",
    "blueprint",
    "src/proper/cli/app_cl.py",
    "src/proper/mail/",
    "src/proper/storage/",
    "src/proper/blueprints/",
]


[tool.pytest.ini_options]
addopts = "--doctest-modules --ignore=src/proper/blueprints"
filterwarnings = [
    "ignore::DeprecationWarning:itsdangerous",
]


[tool.tox]
legacy_tox_ini = """
[tox]
env_list =
    3.12
    3.13
    3.14

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    dev
    test
commands =
    pytest -x src/proper tests
"""

[tool.ruff]
line-length = 90
indent-width = 4
target-version = "py311"
exclude = [
  ".*",
  "_build",
  "build",
  "covreport",
  "dist",
  "blueprint",
  "src/proper/blueprints/*",
]
include = ["*.py"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
fixable = ["ALL"]

ignore = [
	# x is too complex
	"C901",
	# whitespace before ':'
	"E203",
	"E501",
	# x defined from star imports
	"F405",
	# line break before binary operator
	"W505",
	"W605",
]
select = [
	# bugbear
	"B",
	# mccabe"", comprehensions, commas
	"C",
	# pycodestyle errors
	"E",
	# pyflakes
	"F",
	# logging format
	"G",
	# imports
	"I",
	# quotes
	"Q",
	# pycodestyle warnings
	"W",
]

[tool.ruff.lint.isort]
known-first-party = ["proper"]
known-local-folder = ["src/proper"]
no-lines-before = ["local-folder"]
relative-imports-order = "furthest-to-closest"
# Use two line after imports.
lines-after-imports = 2
