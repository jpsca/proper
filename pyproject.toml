[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "proper"
version = "0.2"
description = "A web framework optimized for programmer happiness"
authors = ["Juan-Pablo Scaletti <juanpablo@jpscaletti.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://proper.scaletti.dev/"
repository = "https://github.com/jpsca/proper"
documentation = "https://proper.scaletti.dev/"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
include = [
    "src/proper/blueprints/*"
]
packages = [
    { include = "proper", from = "src" },
]

[tool.poetry.dependencies]
python = "^3.10"
brotli = ">=1.0"
huey = ">=2.4"
image-processing-egg = "*"
inflection = ">=0.5.1"
isort = ">=5.0"
itsdangerous = ">=1.1"
jinja2 = ">=3.0"
jinjax = ">=0.22"
mailshake = "*"
markupsafe = ">=2.0"
passlib = ">=1.7"
peewee = ">=3.15"
proper-cli = ">=1.2"
proper-forms = ">=0.5"
whitenoise = ">=5.2"
peewee-moves = "^2.1.0"
peewee-migrate = "^1.12.1"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = ">=22.10"
ipdb = ">=0.13"
pyright = ">=1.1"
pre-commit = "*"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
flake8 = "*"
flake8-bugbear = "*"
pytest = ">=7.2"
pytest-cov = "*"
tox = "*"

[tool.poetry.scripts]
proper = "proper.cli:run"


[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.tox
  | \.venv
  | _build
  | build
  | dist
  | src/proper/blueprints
)/
'''


[tool.isort]
profile = "black"
force_single_line = true
include_trailing_comma=true
atomic = true
lines_after_imports = 2
lines_between_types = 1


[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "TYPE_CHECKING",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:"
]
omit = [
    "src/proper/app_test.py",
    "src/proper/cli/*",
    "src/proper/blueprints/*",
    "src/proper/storage/*", # TODO
]

[tool.coverage.html]
directory = "covreport"



[tool.pyright]
include = ["src"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/tests",
    "**/cli.py",
]
ignore = ["src/proper/blueprints"]
reportPrivateImportUsage = false
reportWildcardImportFromLibrary = false


[tool.pytest.ini_options]
addopts = "--doctest-modules"


[tool.tox]
legacy_tox_ini = """
[tox]
skipsdist = True
envlist = py310,py311,py312

[testenv]
skip_install = true
allowlist_externals = poetry
commands =
    pip install -U pip wheel
    poetry install --with test
    poetry run pytest -x src/proper tests
"""
