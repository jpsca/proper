[metadata]
name = proper
version= 1.0
url = https://github.com/jpsca/proper
author = Juan-Pablo Scaletti
author_email = juanpablo@jpscaletti.com
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: Internet :: WWW/HTTP :: WSGI
    Topic :: Software Development :: Libraries :: Application Frameworks
    License :: OSI Approved :: Apache Software License
license = Apache License Version 2.0
license_file = LICENSE
description = A web framework optimized for programmer happiness.
long_description = file:README.md
long_description_content_type = text/markdown
keywords =

[options]
packages = proper
include_package_data = true
python_requires = >=3.6,<4.0
install_requires =
    gevent ~= 20.6
    hecto ~= 1.200708
    itsdangerous ~= 1.1
    jinja2 ~= 2.11
    multipart ~= 0.2
    passlib ~= 1.7
    properconf ~= 1.200719
    pyceo ~= 2.200716

[options.extras_require]
test =
    pytest
    pytest-cov
    WebTest

dev =
    pytest
    pytest-cov
    WebTest
    flake8
    ipdb
    tox
    mkdocs
    pymdown-extensions
    pygments
    pygments-github-lexers

[options.entry_points]
console_scripts =
    proper = proper.cli:manager_run


[flake8]
select =
  B,  # bugbear
  B9,  # bugbear opinionated
  C,  # mccabe, comprehensions, commas
  E,  # pycodestyle errors
  F,  # pyflakes
  G,  # logging format
  I,  # imports
  P,
  Q,  # quotes
  RST,  # rst docstring formatting
  T0,  # print
  T4,  # mypy
  W,  # pycodestyle warnings

ignore =
    W503,  # W503 line break before binary operator
    E203,  # E203 whitespace before ':'

max-complexity = 10
max-line-length = 88

statistics = true
doctests = True
accept-encodings = utf-8

[tool:pytest]
addopts = --doctest-modules
