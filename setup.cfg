[metadata]
name = proper
version= 1.191130
author = Juan-Pablo Scaletti
author_email = juanpablo@jpscaletti.com
description = A web framework optimized for programmer happiness.
long_description = file:README.md
long_description_content_type = text/markdown
url = https://properframework.dev
license = Apache License Version 2.0
license_file = LICENSE
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    License :: OSI Approved :: Apache Software License
    Programming Language :: Python :: 3
	Programming Language :: Python :: 3.6"
	Programming Language :: Python :: 3.7"
	Topic :: Internet :: WWW/HTTP :: Dynamic Content"
	Topic :: Internet :: WWW/HTTP :: WSGI :: Application"
	Topic :: Software Development :: Libraries :: Application Frameworks"
	Topic :: Software Development :: Libraries :: Python Modules"

[options]
include_package_data = true
packages = find:
python_requires = >=3.6,<4.0
install_requires =
    cryptography >=2.5, <3.0
    gevent >=1.4, <2.0
    gevent-websocket
    hecto >=1.191026, <2.0
    itsdangerous >=1.1, <2.0
    jinja2 >=2.10, <3.0
    multipart >=0.2, <1.0
    passlib >=1.7.1, <2.0
    pony >=0.7.11, <1.0
    pyceo >=2.191031, <3.0
    pyyaml >=5.1, <6.0
    text-editor >=1.0.5, <2.0
    ujson >=1.35, <2.0
    wsaccel >=0.6, <1.0

[options.packages.find]
exclude =
    tests

[options.extras_require]
testing =
    pytest
    pytest-cov
    WebTest

dev =
    pytest
    pytest-cov
    WebTest
    pytest-flake8
    flake8
    ipdb
    tox
    mkdocs
    pymdown-extensions
    pygments
    pygments-github-lexers


[options.entry_points]
console_scripts =
    proper = proper.cli:start_cli

[flake8]
max-complexity = 10
max-line-length = 88

statistics = true
doctests = True
accept-encodings = utf-8

select = C,E,F,W,B,B950
# W503 line break before binary operator
# E203 whitespace before ':'
# D100  Missing docstring in public module
# D101  Missing docstring in public class
# D102  Missing docstring in public method
# D103  Missing docstring in public function
# D104  Missing docstring in public package
# D105  Missing docstring in magic method
# D107  Missing docstring in __init__
ignore = W503,E203,D100,D101,D102,D103,D104,D105,D107

[tool:pytest]
addopts = --doctest-modules
