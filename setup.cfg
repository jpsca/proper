[metadata]
name = proper
version = 0.1dev4
url = https://github.com/jpsca/proper
project_urls =
    Issue tracker = https://github.com/jpsca/proper/issues
author = Juan-Pablo Scaletti
author_email = juanpablo@jpscaletti.com
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Topic :: Internet :: WWW/HTTP :: WSGI
    Topic :: Software Development :: Libraries :: Application Frameworks
    License :: OSI Approved :: MIT License
    Programming Language :: Python :: 3.7
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
license = MIT
license_files = MIT-LICENSE
description = A web framework optimized for programmer happiness.
long_description = file:README.md
long_description_content_type = text/markdown
keywords =


[options]
packages = find:
include_package_data = true
python_requires = >=3.7,<4.0
install_requires =
    cryptography >=2.9
    inflection >= 0.5.1
    itsdangerous >= 1.1
    jinja2 >= 3.0
    mailshake
    markupsafe >= 2.0
    multipart >= 0.2.3
    passlib >= 1.7
    proper-cli >= 1.0
    proper-forms
    pyyaml >=5.4
    sqla-wrapper >= 5.4
    texteditor >=1.3
    whitenoise >= 5.2
    wrapt >= 1.14

[options.packages.find]
exclude =
    tests

[options.extras_require]
test =
    pytest
    webtest

dev =
    flake8
    flake8-bugbear
    flake8-logging-format
    flake8-quotes
    pre-commit
    pytest-cov
    tox

[options.entry_points]
console_scripts =
    proper = proper.cli_proper:cli


[flake8]
application-package-names = proper
application-import-names = proper
import-order-style = pycharm

select =
  B  # bugbear
  C  # mccabe, comprehensions, commas
  E  # pycodestyle errors
  F  # pyflakes
  G  # logging format
  I  # imports
  P,
  Q  # quotes
  T4  # mypy
  W  # pycodestyle warnings

ignore =
    W503  # line break before binary operator
    W504  # line break after binary operator
    E203  # whitespace before ':'
    E501  # line too long

max-line-length = 98
max-complexity = 10

inline-quotes = double
multiline-quotes = double
docstring-quotes = double

exclude =
  .git
  .venv
  __pycache__
  conftest.py
  docs


[tool:pytest]
addopts = --doctest-modules
