[metadata]
name = proper
version = 0.1
url = https://github.com/jpsca/proper
project_urls =
    Issue tracker = https://github.com/jpsca/proper/issues
author = Juan-Pablo Scaletti
author_email = juanpablo@jpscaletti.com
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Topic :: Internet :: WWW/HTTP :: WSGI
    Topic :: Software Development :: Libraries :: Application Frameworks
    License :: OSI Approved :: Apache Software License
license = Apache License Version 2.0
license_file = LICENSE
description = A web framework optimized for programmer happiness.
long_description = file:README.md
long_description_content_type = text/markdown
keywords =

[options]
packages = find:
include_package_data = true
python_requires = >=3.6,<4.0
install_requires =
    anyascii >=0.1.7, <2.0
    hecto ~=1.0
    itsdangerous ~=1.1
    jinja2 ~=2.11
    multipart >=0.2.3, <2.0
    passlib ~=1.7
    properconf ~=2.2
    pyceo ~=3.1
    whitenoise ~=5.2

[options.packages.find]
exclude =
    tests

[options.extras_require]
test =
    pytest
    pytest-cov
    WebTest

dev =
    black
    flake8
    mkdocs
    pygments
    pygments-github-lexers
    pymdown-extensions
    pytest
    pytest-cov
    tox
    WebTest

[options.entry_points]
console_scripts =
    proper = proper.cli:cli

[flake8]
application-package-names = proper
application-import-names = proper
import-order-style = pycharm

select =
  B,  # bugbear
  C,  # mccabe, comprehensions, commas
  E,  # pycodestyle errors
  F,  # pyflakes
  G,  # logging format
  I,  # imports
  P,
  Q,  # quotes
  T4,  # mypy
  W,  # pycodestyle warnings

ignore =
    W503,  # W503 line break before binary operator
    E203,  # E203 whitespace before ':'
    E501,

max-line-length = 98
max-complexity = 10

inline-quotes = double
multiline-quotes = double
docstring-quotes = double

exclude =
  .git,
  .venv
  __pycache__,
  conftest.py,
  docs,

[tool:pytest]
addopts = --doctest-modules
