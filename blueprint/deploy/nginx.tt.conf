server {
  # listen 443 ssl http2;

  # ssl_certificate /etc/letsencrypt/live/YOURDOMAIN.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.com/privkey.pem;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  server_name YOURDOMAIN.com;
  root /var/www/[[app_name]];

  # The largest request body nginx lets through. Keep it in sync with
  # MAX_CONTENT_LENGTH in [[app_name]]/config/main.py, or uploads that the
  # app accepts will be rejected here.
  client_max_body_size 8M;
  keepalive_timeout 5;
  access_log /var/www/[[app_name]]/log/access.log;
  error_log /var/www/[[app_name]]/log/error.log;

  # Fingerprinted assets (`app-0a1b2c...css`): the hash is removed and the file
  # is served from disk. The URL changes when the file does, so browsers can
  # keep it for good.
  location ~* "^/assets/(.*)-[a-f0-9]{12,}\.([a-z0-9]+)$" {
    root /var/www/[[app_name]];
    try_files /assets/$1.$2 =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # The other assets. Browsers must check that their copy is still good.
  location /assets/ {
    alias /var/www/[[app_name]]/assets/;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  # WebSockets (channels addon): `proper run` serves them from a second
  # process on CABLE_PORT, 2301 by default. Remove this block if the app has
  # no channels.
  location /cable {
    proxy_pass http://127.0.0.1:2301;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://127.0.0.1:2300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  error_page 500 502 503 504 /500.html;
  location = /500.html {
    root /var/www/[[app_name]]/assets;
  }
}
