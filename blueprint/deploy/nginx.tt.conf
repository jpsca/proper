server {
  # listen 443 ssl http2;

  # ssl_certificate /etc/letsencrypt/live/YOURDOMAIN.com/fullchain.pem;
  # ssl_certificate_key /etc/letsencrypt/live/YOURDOMAIN.com/privkey.pem;
  # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  server_name YOURDOMAIN.com;
  root /var/www/[[app_name]];

  client_max_body_size 1M;
  keepalive_timeout 5;
  access_log /var/www/[[app_name]]/log/access.log;
  error_log /var/www/[[app_name]]/log/error.log;

  # Regular expression location block for hashed filenames
  location ~* "^\/assets\/(.*)-[a-z0-9]{12,}\.([a-z0-9]+)$" {
    # Rewrite to the base file name without the hash
    rewrite "^\/assets\/(.*)-[a-f0-9]{12,}\.([a-z0-9]+)$" /assets/$1.$2 break;

    # Try to serve the rewritten file; return 404 if not found
    try_files $uri =404;
  }

  # General handler for all other assets files
  location /assets/ {
    alias /var/www/[[app_name]]/[[app_name]]/assets;
  }

  location / {
    proxy_pass http://127.0.0.1:2300;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  error_page 500 502 503 504 /500.html;
  location = /500.html {
    root /var/www/[[app_name]]/[[app_name]]/assets;
  }
}
