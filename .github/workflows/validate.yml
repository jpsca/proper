name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # ty needs the runtime and the addon (`test` group) packages to resolve imports.
      - name: "Install dependencies"
        run: uv sync --group test --python 3.14t

      - name: "Lint"
        run: make lint
