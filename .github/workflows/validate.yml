name: validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # a local path in [tool.uv.sources] must never reach a commit: it
      # would break `uv sync` for everyone else
      - name: "Checks pyproject.toml has no local sources"
        run: "! grep -q '^\\[tool.uv.sources\\]' pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # the install compiles Proper's native code (hatch_build.py)
      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2

      # ty needs the runtime and the addon (`test` group) packages to resolve imports.
      - name: "Install dependencies"
        run: uv sync --group test --python 3.14t

      - name: "Lint"
        run: make lint
