name: Upload to PyPI

on:
  # Triggers the workflow when a release is created
  release:
    types: [released]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  validate:
    name: validate
    strategy:
      matrix:
        python: ['3.14t', '3.15t']
      fail-fast: false
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      # `uv run` would otherwise switch to the .python-version of the repo
      UV_PYTHON: ${{ matrix.python }}

    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # a local path in [tool.uv.sources] must never reach a commit: it
      # would break `uv sync` for everyone else
      - name: "Checks pyproject.toml has no local sources"
        run: "! grep -q '^\\[tool.uv.sources\\]' pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvips-dev fpc-3.2.2

      - name: "Installs dependencies"
        run: uv sync --group test --python ${{ matrix.python }}

      - name: "Lint"
        run: make lint

      - name: "Test"
        run: make test

  build:
    needs: validate
    name: build ${{ matrix.runner }}
    strategy:
      matrix:
        # x86_64 and aarch64: hatch_build.py tags each wheel for the CPU it
        # built on, and for the newest glibc symbol libproper_native.so needs
        include:
          # the sdist too, once: its wheel is built from it, which tests it
          - runner: ubuntu-24.04
            build: uv build
          - runner: ubuntu-24.04-arm
            build: uv build --wheel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: Install Free Pascal
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc-3.2.2

      - name: "Builds the package"
        run: ${{ matrix.build }}

      - name: "Lists the files"
        run: ls -l dist

      # manylinux_2_34_<cpu>, and auditwheel agrees: a runner with a newer
      # glibc must not raise the tag unnoticed
      - name: "Checks the wheels"
        run: python3 bin/check-wheels.py dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.runner }}
          path: dist/*

  upload:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proper
    permissions:
      # Required for PyPI Trusted Publishing
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Install uv
        uses: astral-sh/setup-uv@v10

      - name: "Uploads to PyPI"
        run: uv publish --trusted-publishing always dist/*
