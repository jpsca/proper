[build-system]
requires = ["poetry-core>=1.3.1"]
build-backend = "poetry.core.masonry.api"


[tool.poetry]
name = "[[ app_name ]]"
version = "1.0"
description = ""
authors = ["Lorem Ipsum <lipsum@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
# psycopg2-binary = "*"
# proper = { file = "proper-0.2-py3-none-any.whl" }

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
black = "*"
uwsgi = "*"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
flake8 = "*"
flake8-bugbear = "*"
pytest = "*"


[tool.black]
line-length = 88
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.tox
  | \.venv
  | _build
  | build
  | dist
)/
'''


[tool.isort]
profile = "black"
force_single_line = true
include_trailing_comma=true
atomic = true
lines_after_imports = 2
lines_between_types = 1


[tool.pytest.ini_options]
addopts = "--doctest-modules"
