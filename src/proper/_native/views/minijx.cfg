# FreePascal options for minijx, read with `fpc @compiler/minijx.cfg` by
# both the Makefile and hatch_build.py. Paths are given on the command line.
# -B rebuilds every unit: the version comes from $MINIJX_VERSION, and fpc
# would otherwise reuse a unit compiled with another one.
-B
-O2
-Xs
-XX
-CX
-vewn
