# FreePascal options for jxc, the views compiler, read with `fpc @jxc.cfg` by
# Proper's `_native/build.py`. Paths are given on the command line.
# -B rebuilds every unit: the version comes from $JXC_VERSION, and fpc
# would otherwise reuse a unit compiled with another one.
-B
-O2
-Xs
-XX
-CX
-vewn
