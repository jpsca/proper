[tox]
skipsdist = True
envlist = py310,py311

[testenv]
skip_install = true
commands =
    poetry install --with test
    make test

[coverage:run]
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if 0:
omit =
	src/proper/base_channel.py
    src/proper/cli

[coverage:html]
directory = covreport
