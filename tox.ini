[tox]
skipsdist = True
envlist = py310,py39,py38,py37

[testenv]
skip_install = true
commands =
    pip install -U pip .[test]
    pytest -x proper tests

[coverage:run]
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    if 0:
omit =
	proper/base_channel.py
    proper/cli

[coverage:html]
directory = covreport
