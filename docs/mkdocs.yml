site_name: Proper
site_description: A web framework optimized for programmer happiness.
site_author: Juan-Pablo Scaletti
site_url: https://properframework.dev

repo_name: GitHub
repo_url: https://github.com/jpscaletti/proper
copyright: Copyright &copy; 2019 Juan-Pablo Scaletti

nav:
  - index.md
  - router.md
  - API:
      - api/index.md
      - api/app.md
      - api/view.md
      - api/request-response.md
      - api/auth.md

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Convergence
    code: Roboto Mono
  custom_dir: overrides
  language: en
  features:
    - navigation.indexes
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highligh
  icon:
    repo: material/github
  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: red
    accent: orange
    toggle:
      icon: octicons/sun-16
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: red
    accent: orange
    toggle:
      icon: octicons/moon-16
      name: Switch to light mode

extra_css:
  - assets/common.css
  - assets/highlight.css
extra_javascript:
  # - assets/termynal.js

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - smarty
  - mkautodoc
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - pymdownx.tilde
  - tables
  - toc:
      permalink: "#"
      toc_depth: 4
