[package]
name = "proper-bench-topcoat"
version = "0.1.0"
edition = "2024"
publish = false
description = "The Topcoat reference app for the Proper benchmarks"

[dependencies]
serde = { version = "1", features = ["derive"] }
toasty = { version = "0.10", features = ["sqlite"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = "0.9"

[profile.release]
lto = true
codegen-units = 1
